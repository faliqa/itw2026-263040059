<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesin Arcade Demo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #fff7d6;
            background: radial-gradient(circle at top, #49216f, #130d27 65%);
        }

        .mesin {
            width: min(100%, 420px);
            padding: 28px;
            text-align: center;
            border: 3px solid #ffd166;
            border-radius: 24px;
            background: linear-gradient(160deg, #9b174c, #4a123e 70%);
            box-shadow: 0 0 24px #ff4d8d88, 0 12px 32px #0008;
        }

        .label-demo {
            margin: 0 0 10px;
            color: #ffe69a;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        h1 {
            margin: 0 0 22px;
            color: #fff2a8;
            font-size: clamp(28px, 8vw, 40px);
            text-shadow: 0 3px #a84c00, 0 0 16px #ffca3a;
        }

        .gulungan {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border: 4px solid #f5b942;
            border-radius: 16px;
            background-color: #fff9e8;
            box-shadow: inset 0 0 12px #44200066;
        }

        .simbol {
            display: grid;
            width: 82px;
            height: 92px;
            place-items: center;
            border-radius: 10px;
            background: linear-gradient(#ffffff, #ffe8ad);
            color: #35152e;
            font-size: 48px;
            box-shadow: 0 4px 8px #44200044;
        }

        .pesan {
            margin: 20px 0 0;
            color: #fff7d6;
            line-height: 1.6;
        }

        .catatan {
            margin: 12px 0 0;
            color: #ffd166;
            font-size: 13px;
        }

        @media (max-width: 360px) {
            .mesin {
                padding: 20px 14px;
            }

            .simbol {
                width: 70px;
                height: 80px;
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <main class="mesin">
        <p class="label-demo">ARCADE • DEMO</p>
        <h1>Mesin Warna</h1>
        <div class="gulungan" aria-label="Tampilan simbol dekoratif">
            <span class="simbol" aria-hidden="true">🍒</span>
            <span class="simbol" aria-hidden="true">⭐</span>
            <span class="simbol" aria-hidden="true">7️⃣</span>
        </div>
        <p class="pesan">Contoh tampilan bergaya arcade untuk latihan HTML dan CSS.</p>
        <p class="catatan">Hanya dekorasi — tidak ada taruhan atau uang asli.</p>
    </main>
</body>
</html>
