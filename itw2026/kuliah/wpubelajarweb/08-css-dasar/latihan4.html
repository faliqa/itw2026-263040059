<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>kata-kata abangku</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');

    body {
      font-family: 'Black Ops One', Courier, monospace;
      font-weight: bold;
      color: #f8f8ff;
      text-align: center;
      background-color: #0F172A;
      background-image: linear-gradient(to bottom, rgb(15 23 42 / 90%) 50%, rgb(15 23 42 / 40%)), url('https://i.pinimg.com/736x/76/ee/fd/76eefddd876dbf7ab20d95541f9dddf7.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }

    h1 {
      font-size: 4em;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: none;
      background-image: linear-gradient(to right, rgb(199, 27, 67) 20%, rgb(184, 41, 41));
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 10px rgba(177, 214, 214, 0.5));
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
      background-color: rgb(255 255 255 / 5%);
      max-width: 600px;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(111, 105, 105, 0.608);
      box-shadow: 0 10px 30px rgba(65, 64, 64, 0.5);
    }

    span {
      color: crimson;
      text-decoration: none;
      text-shadow: 0 0 10px rgb(16, 14, 14)
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151 151 151 / 70%);
      font-weight: normal;
      text-transform: uppercase;
      border-top: 1px solid rgb(255 255 255 / 20%);
      width: 30%;
      margin: 30px auto;
      padding-top: 20px;
    }
  </style>
</head>

<body>

  <h1>quote</h1>

  <p class="quote">
    "orang yang meninggalkan misi demi teman itu <span>sampah</span>,
   tapi orang yang meninggakan teman demi misi itu lebih <span>sampah</span>. <br>
    
  </p>

  <p class="credit">~~Kakashi Hatake~~</p>

</body>

</html>
